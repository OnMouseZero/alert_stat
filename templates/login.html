<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录告警看板</title>
  <style>
    :root {
      --bg: #f4efe8;
      --panel: rgba(255, 252, 247, 0.94);
      --text: #2a2118;
      --muted: #6b5b4d;
      --line: rgba(92, 62, 33, 0.14);
      --accent: #b24a2c;
      --danger: #bf2f45;
      --shadow: 0 18px 40px rgba(94, 65, 38, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(215, 150, 84, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(189, 79, 52, 0.18), transparent 30%),
        linear-gradient(180deg, #f8f3ed 0%, var(--bg) 100%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.1;
    }

    .desc {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      font: inherit;
    }

    button {
      height: 46px;
      border: none;
      border-radius: 14px;
      background: var(--text);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(191, 47, 69, 0.1);
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Alert Dashboard</p>
    <h1>登录看板</h1>
    <p class="desc">请输入账号和密码后访问告警展示页面。</p>

    <form class="form" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}">

      {% if error_message %}
      <div class="error">{{ error_message }}</div>
      {% endif %}

      <label>
        账号
        <input type="text" name="username" autocomplete="username" required>
      </label>

      <label>
        密码
        <input type="password" name="password" autocomplete="current-password" required>
      </label>

      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
